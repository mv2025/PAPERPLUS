<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141F42" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DA2030" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Calendar Wire Spiral Top Pins -->
  <circle cx="18" cy="12" r="2.5" fill="url(#goldGrad)" />
  <circle cx="32" cy="12" r="2.5" fill="url(#goldGrad)" />
  <circle cx="46" cy="12" r="2.5" fill="url(#goldGrad)" />
  <path d="M18 12 v-4 M32 12 v-4 M46 12 v-4" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Stylized Calendar Sheet -->
  <rect x="10" y="16" width="44" height="38" rx="8" fill="#FFFFFF" />
  
  <!-- Red Top Header Bar -->
  <path d="M10 24 c0-4.4 3.6-8 8-8 h28 c4.4 0 8 3.6 8 8 v4 h-44 v-4 z" fill="url(#redGrad)" />
  
  <!-- 'P+' / Paper Plus Emblem -->
  <text x="32" y="45" font-family="serif, Georgia, Times" font-size="21" font-weight="900" fill="#141F42" text-anchor="middle">P<tspan fill="#DA2030">+</tspan></text>
  
  <!-- Sparkle Accent -->
  <path d="M44 20 L45.5 22.5 L48 24 L45.5 25.5 L44 28 L42.5 25.5 L40 24 L42.5 22.5 Z" fill="url(#goldGrad)" />
</svg>